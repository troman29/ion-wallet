Safety Rules: Nguyên tắc an toàn
$safety_rules_private_key_one: |
  Màn hình tiếp theo sẽ hiển thị **khóa riêng tư %chain%**. Hãy lưu chính xác và **cất ở nơi an toàn**.
$safety_rules_private_key_two: Khóa này cho phép **mở ví** nếu bạn quên mật khẩu hoặc mất quyền truy cập thiết bị này.
$safety_rules_private_key_three: Nếu người khác thấy khóa riêng tư này, tiền của bạn **có thể bị đánh cắp**. **Không gửi hay tiết lộ cho bất kỳ ai**, kể cả nhà phát triển hoặc bộ phận hỗ trợ kỹ thuật.
$safety_rules_one: |
  Màn hình tiếp theo sẽ hiển thị **cụm từ khôi phục**. Hãy ghi lại theo đúng thứ tự và **cất ở nơi an toàn**.
$safety_rules_two: Các từ này cho phép **mở ví** nếu bạn quên mật khẩu hoặc mất quyền truy cập thiết bị này.
$safety_rules_three: Nếu người khác thấy các từ này, tiền của bạn **có thể bị đánh cắp**. **Không gửi cho bất kỳ ai**, kể cả nhà phát triển hoặc bộ phận hỗ trợ kỹ thuật.
