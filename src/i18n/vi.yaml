Use Responsibly: Sử dụng có trách nhiệm
$auth_responsibly_description1: |
  %app_name% là ví **tự lưu ký**, nghĩa là **chỉ bạn** có toàn quyền kiểm soát và quan trọng nhất là **chịu hoàn toàn trách nhiệm** đối với tiền của mình.
$auth_responsibly_description2: |
  Khóa riêng tư được lưu trên thiết bị của bạn và có thể bị **tin tặc tấn công**. Nếu máy tính bị nhiễm **phần mềm độc hại**, tiền của bạn có nguy cơ bị đánh cắp.
$auth_responsibly_description3: |
  Đội ngũ %app_name% **không chịu trách nhiệm** về sự an toàn của tiền trong ví, tương tự như nhà sản xuất máy tính hay nhà cung cấp internet của bạn.
$auth_responsibly_description4: |
  **Không bao giờ** giữ toàn bộ tiền ở một nơi. Hãy **đa dạng hóa**, sử dụng nhiều phần mềm và thiết bị khác nhau. Luôn **tự nghiên cứu** và tìm hiểu thêm về bảo mật tiền mã hóa.
Start Wallet: Bắt đầu dùng ví
$auth_backup_warning_notice: |
  Bây giờ bạn cần tự **sao lưu khóa bí mật** để phòng trường hợp quên mật khẩu hoặc mất quyền truy cập thiết bị này.
