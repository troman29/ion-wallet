$auth_responsibly_description1: |
  %app_name% je peněženka s **vlastní správou klíčů**, což znamená, že **pouze vy** máte plnou kontrolu a především **plnou odpovědnost** za své prostředky.
$auth_responsibly_description2: |
  Vaše soukromé klíče jsou uloženy na vašem zařízení a mohou být cílem **hackerských útoků**. Pokud je váš počítač napaden **škodlivým softwarem**, vaše prostředky mohou být odcizeny.
$auth_responsibly_description3: |
  Tým %app_name% **nenese odpovědnost** za bezpečnost vašich prostředků, stejně jako ji nenese výrobce vašeho počítače nebo poskytovatel internetu.
$auth_responsibly_description4: |
  **Nikdy** neuchovávejte všechny prostředky na jednom místě. **Diverzifikujte** a používejte různé softwarové i hardwarové nástroje. Vždy **provádějte vlastní průzkum** a vzdělávejte se v zabezpečení kryptoměn.
