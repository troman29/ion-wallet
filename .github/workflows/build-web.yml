name: Upload sites to S3

on:
  push:
    branches:
      - master
      # Release branches carry the candidate testers actually install, so the web bundle
      # is built from them too rather than only from master.
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLISH_REPO: ${{ vars.PUBLISH_REPO }}
  BRILLIANT_API_BASE_URL: ${{ vars.BRILLIANT_API_BASE_URL }}
  SWAP_FEE_ADDRESS: ${{ vars.SWAP_FEE_ADDRESS }}

jobs:
  build-web:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the Node environment
        uses: mytonwallet-org/shared-actions/prepare_node@master
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Build
        run: |
          if [ -z "$PUBLISH_REPO" ]; then
            npm run build:staging
          else
            npm run build:production
          fi

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.PUBLISH_REPO && 'wallet.ice.io' || 'beta.wallet.ice.io' }}
          path: dist
