name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Simple tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the Node environment
        uses: mytonwallet-org/shared-actions/prepare_node@master
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Prepare default translations
        run: npm run i18n:build:default

      - name: Check types and lint
        run: npm run check

      - name: Test
        run: npm test

      # The standalone SDK sets `NO_EXTRA_FEATURES=1` to exclude guarded extra features from the bundle
      - name: Build the standalone SDK bundle
        run: npm run sdk:build:slim
