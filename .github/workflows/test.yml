name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Simple tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the Node environment
        uses: mytonwallet-org/shared-actions/prepare_node@master
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Prepare default translations
        run: npm run i18n:build:default

      - name: Check types and lint
        run: npm run check

      - name: Test
        run: npm test -- --runInBand

      - name: Check branding assets
        run: npm run check:branding

      - name: Build the production web bundle
        run: npx webpack --mode production
