# Hashed file names never change content, everything else is revalidated
map $uri $cache_control {
    default              "no-cache";
    "~\.[0-9a-f]{20}\."  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json application/wasm;

    # Headers from dist/_headers, which nginx does not read
    include /etc/nginx/csp.conf;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $cache_control always;

    # A missing chunk must fail as 404, not as index.html parsed as a script
    location ~ "\.[0-9a-f]{20}\.[a-z0-9]+$" {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
